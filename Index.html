<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADITYA | EMPIRE HUB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- FALLING AURA CANVAS BACKGROUND --- */
        #aura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- ENTRY SCREEN OVERLAY --- */
        #entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .enter-title {
            font-size: 2.5rem;
            color: #ff0055;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
        }

        .enter-btn {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            border-radius: 50px;
            box-shadow: 0 0 15px #ff0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .enter-btn:hover {
            background: #ff0000;
            box-shadow: 0 0 30px #ff0000, 0 0 50px #ff0000;
            transform: scale(1.05);
        }

        /* --- MAIN DASHBOARD --- */
        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 15px #ff0000; }
            100% { transform: scale(1.03); text-shadow: 0 0 30px #ff0000, 0 0 50px #ffcc00; }
        }

        .title {
            font-size: 3rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000;
            margin-top: 20px;
            margin-bottom: 5px;
        }

        .aura-tag {
            color: #ffcc00;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
            letter-spacing: 1px;
        }

        .card {
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(255, 0, 85, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }

        .card:hover {
            border-color: #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
        }

        h2 {
            color: #ff3366;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
        }

        video {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* Gaming & Social IDs Display */
        .id-box {
            background: rgba(0, 0, 0, 0.9);
            border: 1px dashed #ff0055;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .id-label {
            font-weight: bold;
            color: #ffcc00;
        }

        .id-val {
            font-family: monospace;
            color: #fff;
            background: #222;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #111 0%, #ff0000 100%);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px #ff0000;
            background: linear-gradient(135deg, #ff0000 0%, #990000 100%);
        }

        footer {
            margin-top: 40px;
            margin-bottom: 20px;
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- BACKGROUND AURA RAIN CANVAS -->
    <canvas id="aura-canvas"></canvas>

    <!-- 1. ENTRY SCREEN -->
    <div id="entry-screen" onclick="enterAura()">
        <div class="enter-title">⚡ ADITYA AURA HUB ⚡</div>
        <div class="enter-btn">👑 CLICK TO ENTER 👑</div>
    </div>

    <!-- 2. HIDDEN MUSIC -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- 3. MAIN DASHBOARD -->
    <div id="main-content">
        <h1 class="title">👑 ADITYA 👑</h1>
        <div class="aura-tag">⚡ +999,999 AURA | SIGMA RULE #1 ⚡</div>

        <!-- Gaming IDs Section -->
        <div class="card">
            <h2>🎮 Gaming & Social IDs</h2>
            <div class="id-box">
                <span class="id-label">🔴 Roblox ID:</span>
                <span class="id-val">mr_maurya6</span>
            </div>
            <div class="id-box">
                <span class="id-label">💬 Discord ID:</span>
                <span class="id-val">empire0604</span>
            </div>
        </div>

        <!-- Video Section -->
        <div class="card">
            <h2>🔥 Aditya Edit Video</h2>
            <video controls poster="https://via.placeholder.com/600x300/000000/FF0000?text=ADITYA+AURA">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Social Media Links Section -->
        <div class="card">
            <h2>🌐 Social Media Links</h2>
            <div class="btn-container">
                <a href="https://wa.me/918595452295" target="_blank" class="btn">💬 WhatsApp Profile</a>
            </div>
        </div>

        <footer>
            Developed by ADITYA 👑 | POWERED BY EMPIRE
        </footer>
    </div>

    <script>
        // --- FALLING +999 AURA ANIMATION ---
        const canvas = document.getElementById('aura-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const auraTexts = ["+999 AURA", "+999", "⚡+999⚡", "AURA+999", "👑+999"];
        const fontSize = 16;
        const columns = Math.floor(window.innerWidth / 70);
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = {
                x: i * 75,
                y: Math.random() * -1000,
                speed: 2 + Math.random() * 3,
                text: auraTexts[Math.floor(Math.random() * auraTexts.length)],
                color: Math.random() > 0.3 ? '#ff0055' : '#ffcc00'
            };
        }

        function drawAuraRain() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold ' + fontSize + 'px sans-serif';

            for (let i = 0; i < drops.length; i++) {
                const drop = drops[i];
                ctx.fillStyle = drop.color;
                ctx.shadowColor = drop.color;
                ctx.shadowBlur = 8;
                
                ctx.fillText(drop.text, drop.x, drop.y);

                drop.y += drop.speed;

                if (drop.y > canvas.height) {
                    drop.y = Math.random() * -100;
                    drop.speed = 2 + Math.random() * 3;
                    drop.text = auraTexts[Math.floor(Math.random() * auraTexts.length)];
                }
            }
            requestAnimationFrame(drawAuraRain);
        }

        drawAuraRain();

        // --- ENTER AURA FUNCTION ---
        function enterAura() {
            const entryScreen = document.getElementById('entry-screen');
            entryScreen.style.opacity = '0';
            setTimeout(() => {
                entryScreen.style.display = 'none';
            }, 800);

            const mainContent = document.getElementById('main-content');
            mainContent.style.visibility = 'visible';
            mainContent.style.opacity = '1';

            const music = document.getElementById('bg-music');
            music.play().catch(error => console.log("Audio Error: ", error));
        }
    </script>
</body>
</html>
